name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel in-progress runs for the same ref when new commits land (e.g. rapid
# pushes to a PR) so CI doesn't stack parallel test runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Check go.mod/go.sum are tidy
        # Fails loudly when a PR adds an import without running
        # `go mod tidy`, instead of letting it pass silently.
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9.2.1
        with:
          version: v2.12.2
          install-mode: goinstall
          args: --timeout=5m

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -count=1 -timeout=5m ./...

      - name: App launch smoke
        run: scripts/smoke_app_launch.sh

      - name: Local release install smoke
        run: scripts/smoke_release_local.sh

      - name: Web UI core smoke
        run: scripts/smoke_webui_core.sh

      - name: Upload Web UI smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webui-smoke-artifacts
          path: output/playwright/
          if-no-files-found: ignore
